<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Happy Birthday Agnes 🎉</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- MUSIC -->
  <audio id="bgMusic" loop preload="auto">
    <source src="music.mp3" type="audio/mpeg" />
  </audio>

  <!-- PAGE 1 (BLACK SCREEN) -->
  <section class="page active" id="page1">
    <div class="center">
      <h1 class="intro-title">Happy Birthday</h1>
      <button id="enterBtn" type="button">Click Me</button>
    </div>
  </section>

  <!-- PAGE 2 (CLICK BOX REVEAL) -->
  <section class="page" id="page2">
    <div class="center">
      <div id="revealBox" class="reveal-box" role="button" tabindex="0" aria-label="Reveal birthday box">
        <div class="reveal-hint">Tap to reveal</div>
        <div class="reveal-text" id="revealText">HAPPY 19TH BIRTHDAY AGNES</div>
      </div>
      <button type="button" class="next-btn" onclick="nextPage()">Next ➡️</button>
    </div>
  </section>

  <!-- PAGE 3 (BIRTHDAY LETTER) -->
  <section class="page" id="page3">
    <div class="card">
      <h2 class="page-title">A Birthday Letter 💌</h2>
      <p id="typedMessage" class="letter typing"></p>
      <button type="button" class="next-btn" onclick="nextPage()">Next ➡️</button>
    </div>
  </section>

  <!-- PAGE 4 (BEST PHOTOS) -->
  <section class="page" id="page4">
    <div class="card">
      <h2 class="page-title">Her Best Photos ✨</h2>
      <div class="gallery-grid" data-gallery>
        <img src="her1.jpg" class="gallery" data-gallery-item alt="Best photo 1" loading="lazy" />
        <img src="her2.jpg" class="gallery" data-gallery-item alt="Best photo 2" loading="lazy" />
        <img src="cute1.jpg" class="gallery" data-gallery-item alt="Best photo 3" loading="lazy" />
        <img src="cute2.jpg" class="gallery" data-gallery-item alt="Best photo 4" loading="lazy" />
      </div>
      <button type="button" class="next-btn" onclick="nextPage()">Next ➡️</button>
    </div>
  </section>

  <!-- PAGE 5 (BLESSING) -->
  <section class="page" id="page5">
    <div class="center">
      <h2 class="blessing">MAY GOD BLESS YOU</h2>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
