<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Birthday Agnes 🎉</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<audio id="bgMusic" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<!-- PASSWORD PAGE -->
<section class="page active" id="passwordPage">
  <h2>Enter Password 🔒</h2>
  <input type="password" id="passwordInput" placeholder="Enter password">
  <button onclick="checkPassword()">Enter</button>
  <p id="error"></p>
</section>

<!-- PAGE 1 -->
<section class="page" id="page1">
  <button class="click-btn" onclick="startExperience()">CLICK ME ❤️</button>
</section>

<!-- PAGE 2 -->
<section class="page" id="page2">

  <div class="gift-box" onclick="openBox()">
    <div class="lid"></div>
    <div class="box-body"></div>
  </div>

  <div id="popup" class="popup">
    🎉 HAPPY 19TH BIRTHDAY AGNES 🎉
  </div>

  <button class="next-btn" onclick="nextPage()">Next ➡️</button>
</section>

<!-- PAGE 3 -->
<section class="page" id="page3">
  <h1>Dear Agnes ❤️</h1>
  <p id="typedText" class="letter"></p>
  <button class="next-btn" onclick="nextPage()">Next ➡️</button>
</section>

<!-- PAGE 4 -->
<section class="page" id="page4">
  <h1>Your Beautiful Moments 📸</h1>
  <div class="gallery">
    <img src="her1.jpg">
    <img src="her2.jpg">
    <img src="her3.jpg">
  </div>
  <button class="next-btn" onclick="nextPage()">Next ➡️</button>
</section>

<!-- PAGE 5 -->
<section class="page" id="page5">
  <h1 class="final">MAY GOD BLESS YOU 🙏</h1>
</section>

<script src="script.js"></script>
</body>
</html>
