<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Happy Birthday Agnes 🎉</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="bg-animate">

  <!-- MUSIC -->
  <audio id="bgMusic" loop>
    <source src="music.mp3" type="audio/mpeg" />
  </audio>

  <!-- PAGE 1 -->
  <section class="page active" id="page1">
    <h1 class="title">🎉 Happy Birthday <span class="name">AGNES</span> ❤️</h1>
    <p class="intro">I have something special for you...</p>
    <button onclick="nextPage()">Start the Surprise 🎁</button>
  </section>

  <!-- PAGE 2 -->
  <section class="page" id="page2">
    <h1>Dear Agnes ❤️</h1>
    <p id="typedMessage" class="text typing"></p>
    <button onclick="nextPage()">Next ➡️</button>
  </section>

  <!-- PAGE 3 -->
  <section class="page" id="page3">
    <h1>Cute Things & Places ✨</h1>
    <div class="gallery-box">
      <img src="cute1.jpg" class="gallery">
      <img src="cute2.jpg" class="gallery">
    </div>
    <button onclick="nextPage()">Next ➡️</button>
  </section>

  <!-- PAGE 4 -->
  <section class="page" id="page4">
    <h1>Beautiful Memories 💖</h1>
    <div class="gallery-box">
      <img src="her1.jpg" class="gallery">
      <img src="her2.jpg" class="gallery">
    </div>

    <h2 class="final-text">I Love You Agnes ❤️</h2>
  </section>

  <script src="script.js"></script>
</body>
</html>
