<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Happy Birthday Agnes 🎉</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="bg-animate">

  <!-- MUSIC -->
  <audio id="bgMusic" loop preload="auto" data-audio>
    <source src="music.mp3" type="audio/mpeg" />
  </audio>

  <!-- PAGE 1 -->
  <section class="page active" id="page1">
    <h1 class="title">🎉 Happy Birthday <span class="name">AGNES</span> ❤️</h1>
    <p class="intro">I have something special for you...</p>
    <button type="button" onclick="nextPage()">Start the Surprise 🎁</button>
  </section>

  <!-- PAGE 2 -->
  <section class="page" id="page2">
    <h1>Dear Agnes ❤️</h1>
    <p id="typedMessage" class="text typing"></p>
    <button type="button" onclick="nextPage()">Next ➡️</button>
  </section>

  <!-- PAGE 3 -->
  <section class="page" id="page3">
    <h1>Cute Things & Places ✨</h1>
    <div class="gallery-box" data-gallery>
      <img src="cute1.jpg" class="gallery" data-gallery-item alt="Cute 1" loading="lazy" />
      <img src="cute2.jpg" class="gallery" data-gallery-item alt="Cute 2" loading="lazy" />
    </div>
    <button type="button" onclick="nextPage()">Next ➡️</button>
  </section>

  <!-- PAGE 4 -->
  <section class="page" id="page4">
    <h1>Beautiful Memories 💖</h1>
    <div class="gallery-box" data-gallery>
      <img src="her1.jpg" class="gallery" data-gallery-item alt="Memory 1" loading="lazy" />
      <img src="her2.jpg" class="gallery" data-gallery-item alt="Memory 2" loading="lazy" />
    </div>

    <h2 class="final-text">recieve much love from JOE . LIVE MORE TO EXPERIENCE MORE ❤️
      My God bless your life.
    </h2>
  </section>

  <script src="script.js"></script>
</body>
</html>
